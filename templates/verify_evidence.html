<!DOCTYPE html>
<html>
<head>
    <title>Hash Verification - Cyber Evidence Tracker</title>
</head>

<body>

<h1>Cyber Evidence Chain Tracker</h1>

<h2>SHA-256 Hash Verification</h2>

<a href="/dashboard">Dashboard</a> |
<a href="/evidence">Evidence</a> |
<a href="/logout">Logout</a>

<hr>

<form method="POST">

    <label>Select Evidence:</label><br>

    <select name="evidence_id" required>

        <option value="">-- Select Evidence --</option>

        {% for evidence in evidence_list %}

        <option value="{{ evidence.id }}">
            ID {{ evidence.id }} -
            {{ evidence.file_name }} -
            {{ evidence.case_number }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <label>Enter SHA-256 Hash:</label><br>

    <input
        type="text"
        name="sha256_hash"
        maxlength="64"
        size="70"
        placeholder="Enter 64-character SHA-256 hash"
        required
    >

    <br><br>

    <button type="submit">
        Verify Hash
    </button>

</form>

<hr>

{% if result %}

<h3>{{ result }}</h3>

{% endif %}

</body>
</html>
